plugins {
    id 'com.android.library'
    id 'com.chaquo.python'
}

android {
    compileSdk 33

    defaultConfig {
        minSdkVersion 19
        targetSdkVersion 28
        python {
            // Override with -PbuildPython=<Python 3.8 executable> or TVBOX_BUILD_PYTHON.
            buildPython(project.findProperty('buildPython') ?: System.getenv('TVBOX_BUILD_PYTHON') ?: 'python3.8')
            pip {
                // 与已验证的 car.7 构建保持一致：lxml/ujson/pycryptodome 使用 Chaquopy 提供的
                // Android wheel 版本；不锁定会遇到新版 sdist 的 pyproject.toml，旧 pip 无法解析。
                install "lxml==4.6.3"
                install "ujson==1.35"
                install "pyquery==2.0.2"
                install "requests"
                install "jsonpath"
                install "cachetools"
                install 'pycryptodome==3.9.4'
                install 'beautifulsoup4'
            }
        }
    }

    flavorDimensions "mode"
    productFlavors {
        python {
            dimension "mode"
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a"
            }
        }
        python32 {
            dimension "mode"
            ndk {
                abiFilters "armeabi-v7a"
            }
        }
        python64 {
            dimension "mode"
            ndk {
                abiFilters "arm64-v8a"
            }
        }
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main{
            // Android代码模块
            setRoot "src/main"
            // Python代码模块，也就是你的Python源码所在项目中的文件夹
            python.srcDirs = ["src/python"]
        }
    }
    buildToolsVersion '30.0.3'
}

dependencies {

}
