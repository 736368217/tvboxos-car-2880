name: B01 car regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'player/**'
      - 'pyramid/**'
      - 'quickjs/**'
      - 'car/tests/**'
      - 'car/ci/**'
      - '*.gradle'
      - 'gradle/**'
      - '.github/workflows/test.yml'
      - '.github/workflows/build-release.yml'

permissions:
  contents: write

jobs:
  b01:
    uses: ./.github/workflows/build-release.yml
    secrets: inherit
